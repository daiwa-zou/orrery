apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orrery.serviceAccountName" . }}
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
---
# What the dashboard itself is allowed to do.
#
# Two distinct grants live here and it is worth being explicit about why:
#
#  1. Read access to everything it caches. Informers run under this identity,
#     so the dashboard can technically read any object it is granted here —
#     which is why every user-facing read is gated by an access review first.
#
#  2. The right to impersonate users and groups. This is what lets the API
#     server, not this dashboard, be the thing that enforces RBAC, and what
#     puts the real user in the audit log. It is a powerful grant: anyone who
#     can exec into this pod can act as any user. Treat the pod accordingly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orrery.fullname" . }}
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
rules:
  # Read CRDs, for the additionalPrinterColumns a custom resource declares.
  # The navigation itself comes from discovery and needs no grant; without
  # this, every custom resource list renders with default columns instead.
  - apiGroups: ['apiextensions.k8s.io']
    resources: ['customresourcedefinitions']
    verbs: ['get', 'list', 'watch']

  # Populate the shared caches. This is deliberately broad: the dashboard
  # cannot know in advance which resources people will look at, and per-user
  # authorization happens above this layer.
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['get', 'list', 'watch']

  # Decide what each end user may see. Without this the dashboard cannot
  # answer "may this person read pods in that namespace?" and would have to
  # either guess or show nothing.
  - apiGroups: ['authorization.k8s.io']
    resources: ['subjectaccessreviews', 'selfsubjectaccessreviews']
    verbs: ['create']

  # Act as the signed-in user. Writes, exec and log reads all travel through
  # impersonation, so the API server applies that user's RBAC and records
  # their name rather than this service account's.
  - apiGroups: ['']
    resources: ['users', 'groups', 'serviceaccounts']
    verbs: ['impersonate']
  - apiGroups: ['authentication.k8s.io']
    resources: ['userextras/scopes', 'userextras/oid']
    verbs: ['impersonate']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orrery.fullname" . }}
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orrery.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orrery.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
