apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orrery.fullname" . }}
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      addr: ':8080'
      publicURL: {{ .Values.publicURL | quote }}
      metricsAddr: ':9090'
      webRoot: /srv/web
    oidc:
      enabled: {{ .Values.oidc.enabled }}
      {{- if .Values.oidc.enabled }}
      issuer: {{ .Values.oidc.issuer | quote }}
      clientID: {{ .Values.oidc.clientID | quote }}
      # Read from the environment so the secret never lands in a ConfigMap.
      clientSecret: ${ORRERY_OIDC_CLIENT_SECRET}
      scopes: {{ toJson .Values.oidc.scopes }}
      usernameClaim: {{ .Values.oidc.usernameClaim | quote }}
      groupsClaim: {{ .Values.oidc.groupsClaim | quote }}
      usernamePrefix: {{ .Values.oidc.usernamePrefix | quote }}
      groupsPrefix: {{ .Values.oidc.groupsPrefix | quote }}
      {{- with .Values.oidc.allowedGroups }}
      allowedGroups: {{ toJson . }}
      {{- end }}
      {{- end }}
    session:
      store: {{ .Values.session.store | quote }}
      {{- if eq .Values.session.store "redis" }}
      redisURL: {{ .Values.session.redisURL | quote }}
      {{- end }}
      encryptionKey: ${ORRERY_SESSION_KEY}
      ttl: {{ .Values.session.ttl }}
      idleTimeout: {{ .Values.session.idleTimeout }}
      secure: true
    cache:
      idleTimeout: {{ .Values.cache.idleTimeout }}
      maxInformersPerCluster: {{ .Values.cache.maxInformersPerCluster }}
      syncTimeout: {{ .Values.cache.syncTimeout }}
    authz:
      ttl: {{ .Values.authz.ttl }}
      cacheSize: {{ .Values.authz.cacheSize }}
    proxy:
      enabled: {{ .Values.proxy.enabled }}
    clusters: {{ toJson .Values.clusters }}
