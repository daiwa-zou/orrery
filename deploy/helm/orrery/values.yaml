replicaCount: 2

image:
  repository: ghcr.io/daiwa-zou/orrery
  tag: ''            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: orrery.example.com
  tls:
    enabled: true
    secretName: orrery-tls

# The externally reachable URL. It anchors the OIDC redirect and the WebSocket
# origin check, so it must match what the browser actually uses.
publicURL: https://orrery.example.com

oidc:
  enabled: true
  issuer: https://accounts.example.com
  clientID: orrery
  # Supply the secret out of band and reference it here rather than putting it
  # in values.yaml, which tends to end up in git.
  existingSecret: orrery-oidc
  clientSecretKey: clientSecret
  scopes: [openid, profile, email, groups]
  usernameClaim: email
  groupsClaim: groups
  usernamePrefix: 'oidc:'
  groupsPrefix: 'oidc:'
  allowedGroups: []

session:
  # A 32-byte base64 key shared by every replica. Without it each pod mints its
  # own and users are signed out whenever they hit a different one.
  existingSecret: orrery-session
  keyRef: encryptionKey
  ttl: 12h
  idleTimeout: 2h
  # "memory" keeps sessions in the pod, which only works with one replica.
  # Set "redis" before scaling out, or a request that lands on another pod
  # will not recognise the session.
  store: redis
  redisURL: 'redis://orrery-redis:6379/0'

cache:
  idleTimeout: 10m
  maxInformersPerCluster: 64
  syncTimeout: 15s

authz:
  ttl: 30s
  cacheSize: 65536

# Clusters this dashboard manages.
#
# The in-cluster entry needs no credential. Remote clusters read a kubeconfig
# from a mounted secret; create it with:
#   kubectl create secret generic orrery-kubeconfigs --from-file=prod.yaml=...
clusters:
  - name: in-cluster
    displayName: Local cluster
    inCluster: true
    authMode: impersonation
    labels:
      env: production

kubeconfigSecret: ''   # name of a secret mounted at /etc/orrery/kubeconfigs

resources:
  requests:
    cpu: 200m
    # Informer caches dominate memory use. Budget roughly by the number of
    # objects the dashboard is asked to hold; /api/v1/clusters/{c}/stats
    # reports what is actually cached.
    memory: 512Mi
  limits:
    memory: 2Gi

# Autoscaling is off by default, and that is a considered position rather than
# an omission. Adding replicas does not divide the work here: every replica
# keeps its own informer caches, so a new pod means another full set of watches
# against the API server and another copy of the data in memory. Scaling out
# relieves request throughput and WebSocket fan-out; it does not relieve the
# resource that actually binds, which is memory.
#
# If you do enable it, scale on memory rather than CPU alone — CPU is mostly
# JSON serialization and is rarely what runs out first. Both targets are
# honoured, and setting either to null drops that metric.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Scaling down promptly is wrong for this workload: a replica that goes away
  # takes warm caches with it, and the replacement refills them from the API
  # server on first use. A long stabilisation window keeps a busy period from
  # becoming a sawtooth of cache rebuilds.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
affinity: {}
