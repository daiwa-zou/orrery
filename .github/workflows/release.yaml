# Build and push the container image to GHCR.
#
# Every push to main publishes ghcr.io/daiwa-zou/orrery:main and :sha-<short>.
# Pushing a tag v1.2.3 publishes :1.2.3, :1.2 and :latest. Images are
# multi-arch (amd64 + arm64) and carry provenance attestations.
#
# To also push to Docker Hub, add a second registry login step and the
# repository to the metadata images list, with DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN repository secrets.
name: Release image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  # For provenance attestation via the GitHub OIDC token.
  id-token: write
  attestations: write

jobs:
  push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The chart is installed from a git checkout, so `image.tag` resolves to
      # whatever Chart.yaml says. If that disagrees with the tag being
      # released, the chart points at an image this release never published.
      # Fail here, before anything is pushed, rather than shipping the
      # mismatch.
      - name: Chart version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=$(awk '/^version:/ { print $2; exit }' deploy/helm/orrery/Chart.yaml)
          app=$(awk '/^appVersion:/ { gsub(/"/, "", $2); print $2; exit }' deploy/helm/orrery/Chart.yaml)
          echo "tag=${tag} chart version=${chart} appVersion=${app}"
          if [ "$chart" != "$tag" ] || [ "$app" != "$tag" ]; then
            echo "::error::deploy/helm/orrery/Chart.yaml says version=${chart} appVersion=${app}, but the tag is ${tag}. Bump Chart.yaml before tagging."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Orrery
            org.opencontainers.image.description=Multi-cluster Kubernetes dashboard with OIDC sign-in

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamps main.version, so `orrery -version` in the image reports
          # 1.2.3 for a tag and the branch name for a main build.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
