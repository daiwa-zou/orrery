# Test everything on every push and pull request. The container image is
# built here too (without pushing) so a Dockerfile break fails the PR, not
# the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (go test -race)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        env:
          # Points the Redis session-store tests at the service container;
          # without it they skip.
          ORRERY_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: go test ./... -race -count=1

  web:
    name: Web (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # tsc -b, not --noEmit: the root tsconfig is a project-reference shell
      # with an empty files list, so --noEmit would typecheck nothing.
      - name: Typecheck
        working-directory: web
        run: npx tsc -b
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: helm lint + template
        run: |
          helm lint deploy/helm/orrery
          helm template orrery deploy/helm/orrery \
            --set publicURL=https://orrery.example.com \
            --set oidc.issuer=https://accounts.example.com \
            --set oidc.clientID=orrery > /dev/null

  image:
    name: Container image (build only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
