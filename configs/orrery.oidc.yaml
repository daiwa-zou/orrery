# Development configuration with OIDC sign-in against the local Dex instance.
#
# Both clusters use impersonation, so every call to an API server is made as
# the signed-in user and RBAC is evaluated against their real identity.
server:
  addr: ':8080'
  publicURL: 'http://localhost:5173'
  # The vite port range, for the reason orrery.dev.yaml gives. publicURL stays
  # 5173 because it also anchors the OIDC redirect URL, which Dex has
  # registered; a session on another port signs in through 5173 and works from
  # there.
  corsOrigins:
    - 'http://localhost:5173'
    - 'http://localhost:5174'
    - 'http://localhost:5175'
    - 'http://localhost:5176'
    - 'http://localhost:5177'
    - 'http://localhost:5178'
  metricsAddr: ':9090'

oidc:
  enabled: true
  issuer: 'http://localhost:5556/dex'
  clientID: 'orrery'
  clientSecret: 'orrery-dev-secret'
  redirectURL: 'http://localhost:5173/api/v1/auth/callback'
  scopes: [openid, profile, email, groups]
  # A configured prefix always applies — kube-apiserver semantics — so the
  # impersonated username is oidc:<email>. Configure the apiserver with the
  # same flags and RBAC bindings match exactly.
  usernameClaim: email
  groupsClaim: groups
  usernamePrefix: 'oidc:'
  groupsPrefix: 'oidc:'
  offlineAccess: false

session:
  # Fixed key so restarts during development do not sign everyone out.
  encryptionKey: 'YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY='
  secure: false
  ttl: 12h

authz:
  ttl: 15s

log:
  level: debug

clusters:
  - name: lens-a
    displayName: 'Lens A — primary'
    kubeconfig: ${HOME}/.kube/config
    context: kind-lens-a
    authMode: impersonation
    labels: {env: dev, region: local}

  - name: lens-b
    displayName: 'Lens B — staging'
    kubeconfig: ${HOME}/.kube/config
    context: kind-lens-b
    authMode: impersonation
    labels: {env: staging, region: local}
