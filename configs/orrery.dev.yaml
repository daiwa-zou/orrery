# Local development configuration.
#
# Two clusters deliberately differ in how they authenticate, so both code
# paths get exercised:
#   lens-a  serviceaccount — the dashboard's own credential, full access
#   lens-b  impersonation  — every call is made as the end user, whose RBAC
#                            here grants read-only access
server:
  addr: ':8080'
  publicURL: 'http://localhost:5173'
  # Vite picks the next free port when 5173 is taken, so a second checkout —
  # or a second person — lands on 5174 and upwards. That origin is not a
  # cosmetic difference: it is what the WebSocket upgrader checks, and what
  # the write routes check, so a dev server on an unlisted port gets every
  # socket refused and every write refused while plain reads keep working.
  # Listing the range costs nothing here and removes a failure that reads as
  # "streaming is broken".
  corsOrigins:
    - 'http://localhost:5173'
    - 'http://localhost:5174'
    - 'http://localhost:5175'
    - 'http://localhost:5176'
    - 'http://localhost:5177'
    - 'http://localhost:5178'
  metricsAddr: ':9090'

oidc:
  enabled: false

session:
  secure: false

cache:
  idleTimeout: 10m
  maxInformersPerCluster: 64
  syncTimeout: 20s

authz:
  ttl: 15s

log:
  level: debug

clusters:
  - name: lens-a
    displayName: 'Lens A — primary'
    kubeconfig: ${HOME}/.kube/config
    context: kind-lens-a
    authMode: serviceaccount
    labels:
      env: dev
      region: local

  - name: lens-b
    displayName: 'Lens B — read only'
    kubeconfig: ${HOME}/.kube/config
    context: kind-lens-b
    authMode: impersonation
    labels:
      env: staging
      region: local
